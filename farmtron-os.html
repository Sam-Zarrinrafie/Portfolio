<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmtron OS Browser Simulator | Sam Zarrinrafie</title><meta name="description" content="Interactive browser simulator of the Farmtron OS robotics control interface."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="farmtron-os.css"></head>
<body class="os-body"><header class="os-topbar"><a href="farmtron.html" class="os-back">← Project report</a><div class="os-title"><strong>FARMTRON OS</strong><span>Browser simulator</span></div><div class="os-clock" id="osClock"></div></header>
<main class="os-shell">
  <aside class="os-sidebar"><div class="os-status"><span class="status-dot"></span><div><small>STATUS</small><strong id="connectionState">SIMULATOR READY</strong></div></div><button class="side-action" data-action="shutdown">⏻ <span>Shut Down</span></button><nav id="osTabs" aria-label="Farmtron OS sections"></nav><div class="side-bottom"><label class="toggle-row"><span>AI system</span><input id="aiToggle" type="checkbox" checked><i></i></label><button class="estop" data-action="estop">EMERGENCY STOP</button></div></aside>
  <section class="os-workspace"><div class="workspace-head"><div><p id="viewKicker">FARMTRON CONTROL</p><h1 id="viewTitle">Field Map</h1></div><div class="sim-badge"><span></span> Browser simulation active</div></div><div id="osContent" class="os-content" aria-live="polite"></div></section>
  <aside class="motion-panel"><div class="panel-section coordinate-readout"><h2>POSITION</h2><div><span><small>X</small><b id="posX">0</b></span><span><small>Y</small><b id="posY">0</b></span><span><small>Z</small><b id="posZ">0</b></span></div></div><div class="panel-section"><h2>MOVE TO</h2><div class="coord-inputs"><label>X <input id="moveX" type="number" value="0" min="0" max="1000"></label><label>Y <input id="moveY" type="number" value="0" min="0" max="600"></label><label>Z <input id="moveZ" type="number" value="0" min="0" max="300"></label></div><button class="primary-control" data-action="move">Move</button></div><div class="panel-section"><h2>JOG <select id="jogStep"><option>1</option><option selected>10</option><option>50</option><option>100</option></select> mm</h2><div class="jog-grid"><button data-jog="y+">Y+</button><button data-jog="x-">X−</button><button data-jog="home">⌂</button><button data-jog="x+">X+</button><button data-jog="y-">Y−</button><button data-jog="z+">Z+</button><button data-jog="z-">Z−</button></div></div><div class="panel-section"><h2>HOME AXES</h2><div class="button-row"><button data-home="x">X</button><button data-home="y">Y</button><button data-home="z">Z</button><button data-home="all">ALL</button></div></div><div class="panel-section"><h2>MOTORS</h2><div class="button-row"><button class="motor-on" data-action="motors-on">ON</button><button data-action="motors-off">OFF</button></div></div><div class="panel-section map-elements"><h2>MAP ELEMENTS</h2><label><input type="checkbox" data-layer="grid" checked> Grid</label><label><input type="checkbox" data-layer="plants" checked> Plants</label><label><input type="checkbox" data-layer="moisture" checked> Moisture</label><label><input type="checkbox" data-layer="tools" checked> Tools</label></div></aside>
</main>
<div class="os-toast" id="osToast" role="status"></div>
<dialog id="osDialog"><form method="dialog"><button class="dialog-close" value="cancel">×</button><div id="dialogContent"></div></form></dialog>
<script src="farmtron-os.js"></script></body></html>

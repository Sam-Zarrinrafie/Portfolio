<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FarmtronOS Browser Simulator | Sam Zarrinrafie</title>
  <meta name="description" content="A browser port of the current FarmtronOS control interface running in simulator mode.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="farmtron-os.css"><link rel="stylesheet" href="farmtron-os-override.css">
</head>
<body>
  <header class="portfolio-bar"><a href="farmtron.html">← Farmtron project report</a><span>FarmtronOS browser port · simulator mode</span><button id="fullscreenButton">Fullscreen</button></header>
  <div class="viewport-stage"><div class="farmtron-window" id="farmtronWindow">
    <aside class="native-sidebar">
      <strong class="app-name">FarmtronOS</strong>
      <fieldset class="status-box"><legend>Status</legend><div id="statusText">Status: OK<br>SIMULATOR</div></fieldset>
      <button class="tk-button power-button" data-action="shutdown">⏻ Shut Down</button>
      <fieldset class="tabs-box"><legend>Tabs</legend><nav id="osTabs" aria-label="FarmtronOS tabs"></nav><div class="ai-row"><button class="target-icon" aria-label="Target">◎</button><b>AI</b><button class="toggle-pill" id="aiToggle" aria-label="Toggle AI"><i></i></button></div></fieldset>
      <button class="tk-button estop-button" data-action="estop">E-STOP</button>
    </aside>
    <main class="native-main" id="osContent" aria-live="polite"></main>
    <div class="native-toast" id="osToast"></div>
  </div></div>
  <p class="browser-note">This public build reproduces the FarmtronOS interface and runs locally in simulator mode. Hardware and private service connections are disabled.</p>
  <script src="farmtron-os.js"></script>
</body></html>
